<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisar batería - Taller Fix-Up</title>
    <script src="04_input_value.js" defer></script>
</head>
<body>
    <h1>Taller mecánico Fix-Up</h1>
    <h2>Calcular carga de la batería</h2>

    <label for="inputBateria">Carga actual de la batería (%):</label>
    <input id="inputBateria" type="number" min="0" max="100" placeholder="0 a 100">

    <label for="inputCarga">Carga que se agregará (%):</label>
    <input id="inputCarga" type="number" min="0" max="100" placeholder="0 a 100">

    <button id="calcular" type="button">Calcular</button>
    <p id="calculo">Ingresa los porcentajes de la batería.</p>
</body>
</html>
