<!-- 09_tablas.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Tablas en HTML</h1>
    <table id="tabla_contactos" alt="Tabla de contactos" border="1" width="50%">
        <caption>Tabla de contactos</caption>
        <tr>
            <th colspan="4">Lista de contactos</th>
        </tr>
        <tr>
            <th>Nombre</th>
            <th>Edad</th>
            <th>Ciudad</th>
            
        </tr>
        <tr>
            <td>Juan</td>
            <td>25</td>
            <td colspan="2">Quito</td>
        </tr>
        <tr>
            <td>Maria</td>
            <td>30</td>
            <td colspan="2">Guayaquil</td>
        </tr>
    </table>
    <table id="equipo_tecnico">
        <caption>Equipo técnico</caption>
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Rol</th>
                <th>Especialidad</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Ana</td>
                <td>Ingeniera de software</td>
                <td>Desarrollo web</td>
            </tr>
            <tr>
                <td>Carlos</td>
                <td>Diseñador gráfico</td>
                <td>Diseño UI/UX</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th colspan="3"><sub>*Esto no refleja el equipo técnico de otras sucursales adicionales</sub></th>
            </tr>
        </tfoot>
    </table>
</body>
</html>
