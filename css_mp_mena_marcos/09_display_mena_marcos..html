<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display en el taller mecánico</title>
    <link rel="stylesheet" href="09_display_mena_marcos.css">
</head>
<body>
    <h1>Tipos de respuestos que poseemos en Fix-Up</h1>

    <h2>Sistemas</h2>
    <div class="pieza display-bloque">Motor</div>
    <div class="pieza display-bloque">Sistema de frenos</div>

    <h2>Llantas</h2>
    <div class="pieza display-linea-bloque">Cambio de aceite</div>
    <div class="pieza display-linea-bloque">Revisión de llantas</div>
    <div class="pieza display-linea-bloque">Afinación</div>
    
    <h2>Otros:</h2>
    <span class="pieza display-linea">Aceite</span>
    <span class="pieza display-linea">Filtro</span>
    <span class="pieza display-linea">Bujías</span>
    
    <h2>Socios:</h2>
    <div class="pieza display-flex">
        <span class="pieza">Hyounday</span>
        <span class="pieza">Chevrolet</span>
        <span class="pieza">Otros...</span>
    </div>
</body>
</html>
