<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="12_flexbox_mp_mena_marcos.css">
    <title>Flexbox en el taller mecánico</title>
</head>
<body>
    <h1>Organización del taller</h1>
    <div class="contenedor-reverso">
        <div class="pieza">
            Motor
            </div>
                <div class="pieza">
            Frenos
            </div>
                <div class="pieza">
            Transmisión
            </div>
    </div>
        <div class="contenedor-columna">
        <div class="pieza">
            Aceite
            </div>
                <div class="pieza">
            Filtro
            </div>
                <div class="pieza">
            Bujías
            </div>
    </div>
        <div class="contenedor-columna-inversa">
        <div class="pieza">
            Llantas
            </div>
                <div class="pieza">
            Batería
            </div>
                <div class="pieza">
            Radiador
            </div>
    </div>
    <div class="servicios-final">
        <div class="servicio">Cambio de aceite</div>
        <div class="servicio">Afinación</div>
        <div class="servicio">Diagnóstico</div>
    </div>
    <div class="servicios-inicio">
        <div class="servicio">Frenos</div>
        <div class="servicio">Suspensión</div>
        <div class="servicio">Motor</div>
    </div>
    <div class="servicios-entre">
        <div class="servicio">Cambio de filtro</div>
        <div class="servicio">Revisión de llantas</div>
        <div class="servicio">Cambio de batería</div>
    </div>
    <div class="servicios-alrededor">
        <div class="servicio">Alineación</div>
        <div class="servicio">Balanceo</div>
        <div class="servicio">Revisión general</div>
    </div>
    <div class="servicios-uniformes">
        <div class="servicio">Inspección</div>
        <div class="servicio">Mantenimiento</div>
        <div class="servicio">Reparación</div>
    </div>
    
</body>
</html>
