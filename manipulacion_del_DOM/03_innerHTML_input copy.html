
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manipulación de Dom</title>
    <script src="03_innerHTML_input.js" defer></script>
</head>
<body>
    <h1>Contenidos de Dom</h1>
    <p id="mensaje">Mensaje del mas alla</p>
    <p id="saludo">Saludos!</p>

    <h2>Escribe tu contenido</h2>
    <label for="inputSaludo">Escribe tu nombre:</label>
    <input id="inputSaludo" type="text" placeholder="Escribe tu nombre">

    <input id="inputTitulo" type="text" placeholder="Escribe un título">
    <input id="inputTexto" type="text" placeholder="Escribe un mensaje">
    <button id="btnInsertar" type="button">Insertar texto</button>
    <section id="contenidoInsertado"></section>
</body>
</html>
