<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Incluir JavaScript en HTML</title>
        <script>
            alert("¡Corre, Morty! Al inicio de la página.");
            console.log('Saludo desde el inicio de la página');
        </script>
    </head>
    <body>
            <h1>Incluir Javascript en documento html</h1>
            <h1>
                Incluir Javascript
            </h1>
            <h2>Modo inline</h2>
            <button onclick="alert('!corre, morty')">
                    Botón de mensaje
            </button>
            <input type="text" oninput="console.log(this.value)" placeholder="things...">
            <h2>things</h2>
            <input type="number" onfocus="console.log('valor guardado', this.value)">
            <script src="01_incluir.js"></script>
    </body>

</html>
